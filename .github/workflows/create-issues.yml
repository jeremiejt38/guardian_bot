name: 🗂️ Créer les Issues Scrum Guardian

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tapez "oui" pour créer les ~70 issues (évite les doublons si relancé)'
        required: true
        default: 'non'

jobs:
  create-issues:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'oui'
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Créer toutes les Issues Scrum
        uses: actions/github-script@v7
        with:
          script: |
            await require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/create-issues.js`)({ github, context });
