name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare test environment
        run: |
          echo "NODE_ENV=test" > .env
          echo "DISCORD_TOKEN=dummy-token-for-ci" >> .env
          echo "CLIENT_ID=dummy-client-id" >> .env
          echo "BOT_ADMIN_ID=dummy-admin-id" >> .env
          echo "SERVER_SECRETS_KEY=dummy-secret-key" >> .env
          echo "DATABASE_PATH=./data/guardian-test.db" >> .env
      - name: Install deps
        run: |
          cd guardian
          npm ci
      - name: Run unit tests
        run: |
          cd guardian
          npm test --silent
      - name: Run E2E (requires secrets)
        run: |
          if [ -z "$DISCORD_TOKEN" ] || [ -z "$STAGING_GUILD_ID" ]; then
            echo "Skipping E2E: secrets not configured"
            exit 0
          fi
          cd guardian
          node e2e/run-e2e.js
