name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      STAGING_GUILD_ID: ${{ secrets.STAGING_GUILD_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare test environment
        run: |
          cat > .env <<'EOF'
NODE_ENV=test
DISCORD_TOKEN=dummy-token-for-ci
CLIENT_ID=dummy-client-id
BOT_ADMIN_ID=dummy-admin-id
SERVER_SECRETS_KEY=dummy-secret-key
DATABASE_PATH=./data/guardian-test.db
EOF
      - name: Install deps
        run: |
          cd guardian
          npm ci
      - name: Run unit tests
        run: |
          cd guardian
          npm test --silent
      - name: Run E2E (requires secrets)
        if: ${{ env.DISCORD_TOKEN != '' && env.STAGING_GUILD_ID != '' }}
        run: |
          cd guardian
          node e2e/run-e2e.js
