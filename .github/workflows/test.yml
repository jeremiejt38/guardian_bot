name: test

on:
  pull_request:
  push:
    branches: [main, beta, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guardian/package-lock.json
      - run: npm ci
        working-directory: guardian
      - run: cp .env.example .env
      - run: npm test
        working-directory: guardian
      - run: npm run lint
        working-directory: guardian
